name: Native Windows file operations
on:
  push:
    paths: ['Sources/XUtils/WindowsFileOperations.swift', 'Windows/tests/FileOperationsSmoke.swift', 'Windows/test-file-operations.ps1', '.github/workflows/windows-file-operations.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filesystem:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Test file handles, NTFS links and case-sensitive SDK tree copies
        shell: pwsh
        run: ./Windows/test-file-operations.ps1
