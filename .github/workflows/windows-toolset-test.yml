name: Native Windows Darwin integration
on:
  push:
    paths: ['Windows/test-toolset.ps1', 'Windows/macro-tests/**', '.github/workflows/windows-toolset-test.yml']
  workflow_dispatch:
    inputs:
      toolset_run:
        description: Successful SDK-tools artifact run
        default: '38872672622'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  toolset-integration:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xtool-windows-sdk-tools-x64
          run-id: ${{ inputs.toolset_run || '38872672622' }}
          github-token: ${{ github.token }}
          path: Windows/dist/bin
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Verify real Mach-O linking, Apple archives and dSYM output
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./Windows/test-toolset.ps1
      - name: Export tiny unsigned signing fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'unsigned-macho.zip'
          Compress-Archive -Path Windows/build/toolset-test/library.dylib, Windows/build/toolset-test/source.c -DestinationPath $fixture
          Write-Host ('XTOOL_SIGNING_FIXTURE_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($fixture)))
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-native-macho-fixture
          path: |
            Windows/build/toolset-test/library.dylib
            Windows/build/toolset-test/source.c
