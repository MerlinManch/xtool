name: Native Windows macros
on:
  push:
    paths: ['Windows/build-macros.ps1', '.github/workflows/windows-macros.yml']
  workflow_dispatch:
concurrency:
  group: windows-macros-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macros:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Build and test native macro server independently of LLVM
        shell: pwsh
        run: ./Windows/build-macros.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-macros-x64
          path: Windows/dist/bin/windows-macros/
