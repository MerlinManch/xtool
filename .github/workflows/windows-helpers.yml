name: Native Windows helper tests
on:
  push:
    paths: ['Windows/native/**', 'Windows/tests/**', 'Windows/xip-regression-tests/**', 'Windows/build.ps1', 'Windows/vcpkg.json', 'Sources/CWindowsSupport/**', 'Sources/CWindowsWebSocket/**', 'Windows/websocket-tests/**', '.github/workflows/windows-helpers.yml']
  workflow_dispatch:
concurrency:
  group: windows-helpers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helpers:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/Windows/binary-cache
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache/restore@v4
        with:
          path: Windows/binary-cache
          key: windows-msvc-vcpkg-${{ hashFiles('Windows/vcpkg.json') }}
      - name: Build native helpers and Win32 test programs
        shell: pwsh
        run: ./Windows/build.ps1 -HelpersOnly -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      - name: Test archives, linker invocation and long paths
        shell: pwsh
        run: |
          $env:XTOOL_NATIVE_BIN = "$pwd/Windows/dist/bin"
          $env:XTOOL_NATIVE_TEST_CHILD = "$pwd/Windows/build/Release/xtool-test-child.exe"
          python -m unittest discover -s Windows/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Native helper tests failed' }
          python -m unittest discover -s Windows/xip-regression-tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Xcode CPIO permission tests failed' }
      - name: Test Win32 locking and credential protection
        shell: pwsh
        run: |
          ./Windows/build/Release/xtool-test-support.exe
          if ($LASTEXITCODE -ne 0) { throw 'Win32 support tests failed' }
      - name: Test native WinHTTP WebSockets and cancellation
        shell: pwsh
        run: |
          $env:XTOOL_WINHTTP_TEST_DLL = "$pwd/Windows/build/websocket-tests/Release/xtool-test-websocket.dll"
          python -m unittest discover -s Windows/websocket-tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Native WinHTTP WebSocket tests failed' }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: Windows/binary-cache
          key: windows-msvc-vcpkg-${{ hashFiles('Windows/vcpkg.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-helpers-x64
          path: Windows/dist/
