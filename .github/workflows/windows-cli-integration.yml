name: Native Windows CLI integration
on:
  workflow_run:
    workflows: ['Native Windows port']
    types: [completed]
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: Semantic-check run containing a built native CLI
        required: false
permissions:
  contents: read
  actions: read
jobs:
  integration:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: windows-2022
    steps:
      - uses: actions/github-script@v7
        id: source
        env:
          XTOOL_DIAGNOSTIC_RUN: ${{ inputs.diagnostic_run }}
        with:
          script: |
            let run = context.payload.workflow_run;
            if (!run && process.env.XTOOL_DIAGNOSTIC_RUN) {
              run = (await github.rest.actions.getWorkflowRun({ ...context.repo,
                run_id: Number(process.env.XTOOL_DIAGNOSTIC_RUN) })).data;
            }
            if (!run) {
              const branch = context.ref.replace('refs/heads/', '');
              run = (await github.rest.actions.listWorkflowRuns({ ...context.repo,
                workflow_id: 'windows-native.yml', branch, status: 'success', per_page: 1 })).data.workflow_runs[0];
            }
            const run_id = run?.id;
            if (!Number.isSafeInteger(run_id) || run_id <= 0) throw new Error('Invalid workflow run ID');
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({ ...context.repo, run_id });
            const artifact = data.artifacts.find(a =>
              (a.name === 'xtool-windows-native-x64' || a.name.startsWith('xtool-windows-diagnostic-')) && !a.expired);
            if (!artifact) throw new Error('No native diagnostic CLI artifact in selected run');
            core.setOutput('run', run_id);
            core.setOutput('sha', run.head_sha);
            core.setOutput('artifact', artifact.name);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: Windows/runtime-test
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Verify native Swift file handles, NTFS hardlinks and SDK directory links
        shell: pwsh
        run: ./Windows/test-file-operations.ps1
      - name: Verify CLI commands, project creation and complete synthetic SDK lifecycle
        shell: pwsh
        run: |
          $env:XTOOL_CLI = "$pwd/Windows/runtime-test/bin/xtool.exe"
          $env:PATH = "$pwd/Windows/runtime-test/bin;$env:PATH"
          & $env:XTOOL_CLI --version
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI startup failed' }
          foreach ($command in @('', 'setup', 'auth', 'sdk', 'new', 'dev', 'ds', 'devices', 'install', 'uninstall', 'launch')) {
            $helpArgs = @('--help')
            if ($command) { $helpArgs = @($command, '--help') }
            & $env:XTOOL_CLI @helpArgs
            if ($LASTEXITCODE -ne 0) { throw "CLI help failed: $command" }
          }
          python -m unittest discover -s Windows/cli-tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI lifecycle integration failed' }
      - name: Diagnose native Foundation SDK path operations
        if: failure()
        shell: pwsh
        run: |
          $source = @'
          import Foundation
          let manager = FileManager.default
          let root = URL(fileURLWithPath: CommandLine.arguments[1])
              .appendingPathComponent("xtool path ü " + UUID().uuidString)
          defer { try? manager.removeItem(at: root) }
          func describe(_ label: String, _ url: URL) {
              print(label, "URL:", url.absoluteString, "path:", url.path, "last:", url.lastPathComponent)
          }
          describe("root", root)
          try manager.createDirectory(at: root, withIntermediateDirectories: true)
          let reconstructed = URL(fileURLWithPath: root.path, isDirectory: true)
          for (name, url) in [("new", reconstructed.appending(path: "new")),
                              ("old", reconstructed.appendingPathComponent("old"))] {
              describe(name, url)
              do { try manager.createDirectory(at: url, withIntermediateDirectories: true); print("mkdir OK") }
              catch { print("mkdir ERROR:", error) }
          }
          let file = root.appendingPathComponent("source.exe")
          try Data([1, 2, 3]).write(to: file)
          for child in try manager.contentsOfDirectory(at: root, includingPropertiesForKeys: nil) {
              describe("enumerated", child)
              if child.lastPathComponent == "source.exe" {
                  let destination = root.appendingPathComponent("copy.exe")
                  do { try manager.copyItem(at: child, to: destination); print("copy OK") }
                  catch { print("copy ERROR:", error) }
              }
          }
          '@
          $probe = Join-Path $env:RUNNER_TEMP 'xtool-path-probe.swift'
          $executable = Join-Path $env:RUNNER_TEMP 'xtool-path-probe.exe'
          Set-Content $probe $source -Encoding utf8
          swiftc $probe -o $executable
          if ($LASTEXITCODE -ne 0) { throw 'Path probe compilation failed' }
          & $executable $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Path probe failed' }
