name: Native Windows port
on:
  push:
    paths: ['Windows/build.ps1', 'Windows/native/**', 'Windows/tests/**', 'Windows/cli-tests/**', 'Windows/vcpkg.json', 'Windows/patches/xtool-core.patch', 'Windows/patches/zsign.patch', 'Windows/patches/PathKit.patch', 'Windows/patches/swift-issue-reporting.patch', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['Windows/build.ps1', 'Windows/native/**', 'Windows/tests/**', 'Windows/cli-tests/**', 'Windows/vcpkg.json', 'Windows/patches/xtool-core.patch', 'Windows/patches/zsign.patch', 'Windows/patches/PathKit.patch', 'Windows/patches/swift-issue-reporting.patch', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/windows-native.yml']
  workflow_dispatch:
concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  helpers:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/Windows/binary-cache
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem Windows/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Prepare binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache/restore@v4
        with:
          path: Windows/binary-cache
          key: windows-msvc-vcpkg-${{ hashFiles('Windows/vcpkg.json') }}
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Build native helpers
        shell: pwsh
        run: ./Windows/build.ps1 -HelpersOnly -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      - name: Test XIP extraction
        shell: pwsh
        run: |
          $env:XTOOL_NATIVE_BIN = "$pwd/Windows/dist/bin"
          $env:XTOOL_NATIVE_TEST_CHILD = "$pwd/Windows/build/Release/xtool-test-child.exe"
          python -m unittest discover -s Windows/tests -v
      - name: Test Win32 primitives
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          ./Windows/build/Release/xtool-test-support.exe
          if ($LASTEXITCODE -ne 0) { throw 'Win32 support tests failed' }
      - name: Compile Win32 primitives
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /W4 /WX /c /ISources/CWindowsSupport/include Sources/CWindowsSupport/WindowsSupport.c /FoWindows/build/WindowsSupport.obj
          if ($LASTEXITCODE -ne 0) { throw 'Win32 support compilation failed' }
      - uses: actions/cache/restore@v4
        id: swift_cache
        if: ${{ !cancelled() }}
        with:
          path: .build
          key: windows-swift-6.4.1-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            windows-swift-6.4.1-${{ hashFiles('Package.resolved') }}-
            windows-swift-6.4.1-
      - name: Build and test complete Swift CLI
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./Windows/build.ps1 -RunTests -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.swift_cache.outputs.cache-primary-key != '' }}
        with:
          path: .build
          key: ${{ steps.swift_cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: Windows/binary-cache
          key: windows-msvc-vcpkg-${{ hashFiles('Windows/vcpkg.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-native-x64
          path: Windows/dist/bin/
