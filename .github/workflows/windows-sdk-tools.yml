name: Native Windows SDK tools
on:
  push:
    paths: ['Windows/build-toolset.ps1', '.github/workflows/windows-sdk-tools.yml']
  workflow_dispatch:
concurrency:
  group: windows-sdk-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolset:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@86d1ddeaf915c282137601aeb0654ea0e7b7f17e
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Build Darwin host tools and macro server
        shell: pwsh
        run: ./Windows/build-toolset.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-sdk-tools-x64
          path: Windows/dist/bin/
