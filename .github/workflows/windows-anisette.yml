name: Native Windows Anisette
on:
  push:
    paths: ['Windows/build-anisette.ps1', 'Windows/patches/xadi.patch', 'Windows/anisette-tests/**', 'Sources/CWindowsADI/**', '.github/workflows/windows-anisette.yml']
  workflow_dispatch:
concurrency:
  group: windows-anisette-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anisette:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3
        with:
          compiler: ldc-1.43.0
      - name: Build local Anisette runtime
        shell: pwsh
        run: ./Windows/build-anisette.ps1
      - name: Compile and test the C-to-D loader bridge
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          Import-Module "$vs/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cl /nologo /W4 /WX /ISources/CWindowsADI/include Sources/CWindowsADI/WindowsADI.c Windows/anisette-tests/bridge.c /FeWindows/dist/bin/xtool-test-anisette.exe
          if ($LASTEXITCODE -ne 0) { throw 'Anisette C bridge compilation failed' }
          ./Windows/dist/bin/xtool-test-anisette.exe
          if ($LASTEXITCODE -ne 0) { throw 'Anisette C bridge test failed' }
          Remove-Item Windows/dist/bin/xtool-test-anisette.exe
      - name: Test local Anisette DLL and Apple library initialization
        shell: pwsh
        run: |
          $env:XTOOL_ANISETTE_DLL = "$pwd/Windows/dist/bin/XADIBinary.dll"
          $env:XTOOL_TEST_APPLE_LIBRARIES = '1'
          $env:XTOOL_TEST_APPLE_PROVISIONING = '1'
          python -m unittest discover -s Windows/anisette-tests -p test_anisette_runtime.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-anisette-x64
          path: Windows/dist/
