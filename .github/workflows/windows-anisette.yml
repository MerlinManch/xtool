name: Native Windows Anisette
on:
  push:
    paths: ['Windows/build-anisette.ps1', 'Windows/patches/xadi.patch', 'Windows/anisette-tests/**', '.github/workflows/windows-anisette.yml']
  workflow_dispatch:
concurrency:
  group: windows-anisette-${{ github.ref }}
  cancel-in-progress: true
jobs:
  anisette:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@a6f7969b8b5dc3ff448c30f2c6749150795814f3
        with:
          compiler: ldc-1.43.0
      - name: Build local Anisette runtime
        shell: pwsh
        run: ./Windows/build-anisette.ps1
      - name: Test local Anisette DLL and Apple library initialization
        shell: pwsh
        run: |
          $env:XTOOL_ANISETTE_DLL = "$pwd/Windows/dist/bin/XADIBinary.dll"
          $env:XTOOL_TEST_APPLE_LIBRARIES = '1'
          python -m unittest discover -s Windows/anisette-tests -p test_anisette_runtime.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: xtool-windows-anisette-x64
          path: Windows/dist/
